<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Tracker — Daily Tasks, Timetables & Activity Heatmap</title>
  <meta name="description" content="Personal progress tracker for recording daily tasks, weekly academic and career timetables, completed activities, and visualizing progress over time with a GitHub-style heatmap.">
  <meta name="theme-color" content="#090D16">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/modal.css">
  <link rel="stylesheet" href="/src/styles/dashboard.css">
  <link rel="stylesheet" href="/src/styles/tasks.css">
  <link rel="stylesheet" href="/src/styles/timetables.css">
  <link rel="stylesheet" href="/src/styles/activity.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <!-- Brand -->
      <div class="brand" data-view="dashboard" id="brandLogo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">Personal Tracker</span>
          <span class="brand-subtitle">V1 Focus &bull; Progress</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs" aria-label="Main Navigation">
        <button class="nav-tab active" data-view="dashboard" id="navTabDashboard">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          </span>
          <span>Dashboard</span>
        </button>

        <button class="nav-tab" data-view="tasks" id="navTabTasks">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><polyline points="3 6 4 7 6 5"></polyline><polyline points="3 12 4 13 6 11"></polyline><polyline points="3 18 4 19 6 17"></polyline></svg>
          </span>
          <span>Daily Tasks</span>
        </button>

        <button class="nav-tab" data-view="timetables" id="navTabTimetables">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </span>
          <span>Timetables</span>
        </button>

        <button class="nav-tab" data-view="activity" id="navTabActivity">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          </span>
          <span>Activity & Heatmap</span>
        </button>
      </nav>

      <!-- Right Header Actions -->
      <div class="header-actions">
        <!-- Global Streak Badge -->
        <div class="streak-badge" id="globalStreakBadge" title="Current continuous activity streak">
          <span class="streak-flame">🔥</span>
          <span>0 Day Streak</span>
        </div>

        <!-- Quick Log Work Button -->
        <button class="btn btn-primary btn-sm" id="headerLogActivityBtn" title="Log completed work session">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Log Work</span>
        </button>

        <!-- Quick Add Task Button -->
        <button class="btn btn-secondary btn-sm" id="headerNewTaskBtn" title="Create a new task">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Task</span>
        </button>

        <!-- Data & Settings Modal Trigger -->
        <button class="btn btn-ghost btn-icon-only btn-sm" id="dataSettingsBtn" title="Data Backup & Demo Options">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-main">
    <section id="view-dashboard" class="view-section active" aria-labelledby="navTabDashboard"></section>
    <section id="view-tasks" class="view-section" aria-labelledby="navTabTasks"></section>
    <section id="view-timetables" class="view-section" aria-labelledby="navTabTimetables"></section>
    <section id="view-activity" class="view-section" aria-labelledby="navTabActivity"></section>
  </main>

  <!-- Universal Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-container" id="modalContainer">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Universal Slide-over Drawer (e.g. for Day Inspector) -->
  <div class="drawer-overlay" id="drawerOverlay" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-container" id="drawerContainer">
      <div class="drawer-header">
        <h3 class="drawer-title" id="drawerTitle">Details</h3>
        <button class="modal-close-btn" id="drawerCloseBtn" aria-label="Close drawer">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Entry Script -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
